<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NxTools 布局原型截图对照</title>
<style>body{margin:0;background:#121215;color:#f4f4f5;font:13px/20px 'Microsoft YaHei UI',sans-serif}header{padding:16px;border-bottom:1px solid #27272a}h1{font-size:16px;margin:0 0 8px}p{color:#a1a1aa;margin:8px 0}select,button{font:inherit;background:#1f1f23;color:inherit;border:1px solid #27272a;border-radius:3px;height:32px;padding:0 8px}a{color:#38bdf8}main{padding:16px;overflow:auto}img{display:block;max-width:100%;height:auto;border:1px solid #27272a}body.actual img{max-width:none}output{color:#a1a1aa;display:block;margin:8px 0}button:focus-visible,select:focus-visible{outline:2px solid #38bdf8}</style>
<header><h1>布局原型 · 截图对照</h1><p>浏览器设计稿，不是安装版 GPUI；全部为合成数据。<a href="prototype/index.html">打开可交互原型</a></p><label>页面 <select id="page"><option value="downloads">下载工作区</option><option value="global">全局设置 / 应用黑名单</option><option value="quickSettings">速启 / 命令编辑</option><option value="clipboardSettings">剪贴板设置</option><option value="quickPopup">速启弹窗</option><option value="clipboardPopup">剪贴板弹窗</option><option value="confirm">新建下载确认</option><option value="progress">下载进度</option></select></label> <button id="mode">切换为 1:1 原尺寸</button><output id="readout"></output></header><main><img id="image" alt="所选页面的原型截图"></main>
<script>const pages={downloads:[1060,650],global:[720,480],quickSettings:[1060,650],clipboardSettings:[1060,650],quickPopup:[620,410],clipboardPopup:[300,440],confirm:[560,278],progress:[440,184]};const image=document.getElementById('image');const selector=document.getElementById('page');let actual=false;function update(){const page=selector.value;image.src='screenshots/'+page+'.png';document.getElementById('readout').textContent=pages[page].join(' × ')+' 原始 CSS 像素 · '+(actual?'1:1 原尺寸（浏览器缩放需100%）':'适应面板：可能缩小，不作为字体可读性验收');document.body.classList.toggle('actual',actual);document.getElementById('mode').textContent=actual?'切换为适应面板':'切换为 1:1 原尺寸'}selector.addEventListener('change',update);document.getElementById('mode').addEventListener('click',()=>{actual=!actual;update()});update();</script></html>
