<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NxTools · 下载工作台</title>
  <link rel="stylesheet" href="popup-tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <a class="skip-nav" href="#mainContent">跳到主要内容</a>
  <div class="shell">
    <header class="masthead">
      <img class="brand-mark" src="icons/icon-32.png" alt="" width="20" height="20">
      <h1>NxTools</h1>
      <div class="connection" role="status" aria-live="polite"><span id="statusDot" class="dot"></span><span id="statusText">读取桌面状态…</span></div>
    </header>
    <section class="page-context" aria-label="当前网页">
      <div class="page-copy"><strong id="activeTabTitle">正在读取当前页面</strong><small id="activeTabDomain">—</small></div>
      <button id="sendTabButton" class="accent-button" title="把当前网页地址发送到 NxTools">发送页面</button>
    </section>
    <nav class="tabs" role="tablist" aria-label="扩展功能">
      <button id="tasksTab" class="tab active" role="tab" data-view="tasks" aria-controls="tasksView" aria-selected="true" tabindex="0">任务 <small id="taskTabCount" class="tab-count">0</small></button>
      <button id="resourcesTab" class="tab" role="tab" data-view="resources" aria-controls="resourcesView" aria-selected="false" tabindex="-1">捕获 <small id="resourceTabCount" class="tab-count">0</small></button>
      <button id="advancedTab" class="tab" role="tab" data-view="advanced" aria-controls="advancedView" aria-selected="false" tabindex="-1">媒体工具</button>
      <button id="settingsTab" class="tab" role="tab" data-view="settings" aria-controls="settingsView" aria-selected="false" tabindex="-1">设置</button>
    </nav>
    <main id="mainContent" class="workspace" tabindex="-1">
      <section id="tasksView" class="view active" role="tabpanel" aria-labelledby="tasksTab" aria-hidden="false">
        <label class="switch-row site-toggle" id="siteToggleRow"><span><strong>接管当前网站的下载</strong><small id="siteToggleHint">正在读取网站策略</small></span><input id="siteEnabledToggle" type="checkbox" aria-label="切换当前网站接管"></label>
        <div class="section-head"><h2>桌面任务 <small id="taskCountText" class="count">0</small></h2><small>最近 8 项 · 由桌面端管理</small></div>
        <div id="taskList" class="list task-list" aria-label="桌面下载任务"></div>
      </section>
      <section id="resourcesView" class="view" role="tabpanel" aria-labelledby="resourcesTab" aria-hidden="true">
        <div class="resource-toolbar">
          <div class="filter-row" role="group" aria-label="资源类型过滤">
            <button class="pill active" data-resource-filter="all" aria-pressed="true">全部</button><button class="pill" data-resource-filter="streaming" aria-pressed="false">流媒体</button><button class="pill" data-resource-filter="video" aria-pressed="false">视频</button><button class="pill" data-resource-filter="audio" aria-pressed="false">音频</button><button class="pill" data-resource-filter="download" aria-pressed="false">文件</button>
          </div>
          <div id="signalRail" class="capture-summary"><span id="captureSummaryText">读取中</span><small id="captureAgeText"></small></div>
          <button id="clearResourcesButton" class="ghost">清空</button>
        </div>
        <div class="batch-toolbar" hidden><span id="currentResourceCountText">已选 0 项</span><button id="clearSelectionButton" class="ghost">取消选择</button><button id="batchResourcesButton" class="primary batch-action" disabled>批量加入队列</button></div>
        <div id="currentResourceList" class="list resource-list" aria-label="当前页面资源"></div>
        <div class="section-head muted"><h2>其他页面</h2></div><div id="otherResourceList" class="list compact-list resource-list" aria-label="其他页面资源"></div>
      </section>
      <section id="advancedView" class="view" role="tabpanel" aria-labelledby="advancedTab" aria-hidden="true">
        <section class="panel tool-panel"><div class="section-head inline"><h2>当前媒体</h2><small id="mediaStateText">未检测到媒体</small></div>
          <select id="mediaSelect" class="select" aria-label="选择页面媒体"></select>
          <div class="media-actions"><button id="mediaPlayButton" class="primary">播放</button><button id="mediaPipButton">画中画</button><button id="mediaScreenshotButton">截图</button></div>
          <label class="range-row"><span>进度</span><input id="mediaTimeRange" type="range" min="0" max="1000" value="0"></label>
          <label class="range-row"><span>音量</span><input id="mediaVolumeRange" type="range" min="0" max="100" value="100"></label>
          <div class="media-actions secondary"><button id="mediaMuteButton" aria-pressed="false">静音</button><button id="mediaLoopButton" aria-pressed="false">循环</button><div class="speed-control"><label for="mediaSpeedInput">倍速</label><input id="mediaSpeedInput" type="number" min="0.25" max="4" step="0.05" value="1" aria-label="播放倍速"><button id="mediaSpeedButton">应用</button></div></div>
        </section>
        <div class="section-head"><h2>当前标签页工具</h2><small>即时生效</small></div>
        <section class="panel feature-grid" aria-label="捕获工具开关">
          <button id="featureOverlayButton" class="feature-card" aria-pressed="false"><span><strong>媒体悬浮入口</strong><small>在视频旁选择资源并发送下载</small></span><span class="feature-state" aria-hidden="true"></span></button>
          <button id="featureDeepScanButton" class="feature-card" aria-pressed="false"><span><strong>深度资源捕获</strong><small>按需扫描页面，不持续遍历网页</small></span><span class="feature-state" aria-hidden="true"></span></button>
          <button id="featureMobileUaButton" class="feature-card" aria-pressed="false"><span><strong>移动端 User-Agent</strong><small>仅当前标签页，刷新后生效</small></span><span class="feature-state" aria-hidden="true"></span></button>
        </section>
      </section>
      <section id="settingsView" class="view" role="tabpanel" aria-labelledby="settingsTab" aria-hidden="true">
        <section class="settings-intro"><div><h2>本地连接</h2><small>连接 NxTools 桌面端。打开面板不会自动启动桌面端。</small></div><button id="testButton">测试连接</button></section>
        <p class="settings-policy">更改会自动保存。保存失败时保留当前选择，可用底部按钮重试。</p>
        <section class="settings-group"><h2 class="group-label">下载接管</h2>
          <label class="switch-row"><span><strong>拦截浏览器下载</strong><small>仅在 NxTools 明确接受后取消浏览器原下载</small></span><input id="interceptDownloads" type="checkbox"></label>
          <label class="switch-row"><span><strong>弹出下载确认窗口</strong><small>预填地址、文件名和请求上下文，确认后开始</small></span><input id="openDialog" type="checkbox"></label>
          <label class="switch-row"><span><strong>页面资源捕获</strong><small>事件驱动捕获媒体与常见文件资源</small></span><input id="captureResources" type="checkbox"></label>
          <label class="switch-row"><span><strong>清理浏览器下载记录</strong><small>只移除已成功交接的取消项</small></span><input id="eraseBrowserHistory" type="checkbox"></label>
        </section>
        <section class="settings-group"><h2 class="group-label">网页入口</h2>
          <label class="switch-row"><span><strong>媒体悬浮入口</strong><small>在当前媒体旁显示下载动作</small></span><input id="mediaOverlayEnabled" type="checkbox"></label>
          <label class="switch-row"><span><strong>拖放目标</strong><small>拖动网页链接时显示发送区域</small></span><input id="dropTargetEnabled" type="checkbox"></label>
          <div class="drop-target-settings"><label class="field"><span>位置</span><select id="dropTargetPosition" class="select"><option value="left-top">左上</option><option value="left-bottom">左下</option><option value="right-top">右上</option><option value="right-bottom">右下</option><option value="center-top">中间顶部</option><option value="center-bottom">中间底部</option></select></label><label class="field"><span>宽度 px</span><input id="dropTargetWidth" type="text" inputmode="numeric"></label><label class="field"><span>高度 px</span><input id="dropTargetHeight" type="text" inputmode="numeric"></label></div>
        </section>
        <section class="settings-group"><h2 class="group-label">请求上下文</h2>
          <label class="switch-row"><span><strong>携带必要 Header</strong><small>仅保留下载所需的白名单字段</small></span><input id="includeRequestHeaders" type="checkbox"></label>
          <label class="switch-row"><span><strong>携带 Cookie</strong><small>用于需要登录状态的资源，仅交给本地下载端</small></span><input id="includeCookies" type="checkbox"></label>
        </section>
        <button id="saveButton" class="primary settings-save">保存设置</button>
      </section>
    </main>
    <footer class="status-footer" hidden><p id="messageText" class="message" role="status" aria-live="polite"></p><button id="dismissMessageButton" class="ghost dismiss" aria-label="关闭提示">关闭</button></footer>
  </div>
  <script src="popup/format.js"></script>
  <script src="popup/dom.js"></script>
  <script src="popup/render.js"></script>
  <script src="popup/actions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
