const status = item => `<span class="tag ${toneFor[item.state]}">${titleFor[item.state]}</span>`;
const btn = (text, data, style='', ic='') => `<button type="button" class="btn ${style}" ${data}>${ic?icon(ic):''}${text}</button>`;
function notify(message){ clearTimeout(feedbackTimer); $('feedback').textContent=message; $('feedback').hidden=false; feedbackTimer=setTimeout(()=>{$('feedback').hidden=true},2700); }
function updateTheme(){const dark=document.documentElement.dataset.theme==='dark';$('theme').innerHTML=icon(dark?'sun':'moon')+`<span>${dark?'切换浅色':'切换深色'}</span>`;$('theme').setAttribute('aria-label',dark?'切换浅色':'切换深色');}
function setTab(value, reset=false){tab=value;if(reset){$('query').value='';$('category').value='all';} $('content').scrollTop=0;render();}
function render(){
 const n=items.filter(needs).length;
 $('tabs').innerHTML=tabs.map(([key,label])=>`<button type="button" data-tab="${key}" ${key===tab?'aria-current="page"':''}>${label}${key==='installed'||key==='attention'?`<span class="count">${key==='installed'?items.length:n}</span>`:''}</button>`).join('');
 $('attention').hidden=tab!=='installed'||n===0;
 $('attention').innerHTML=`<span class="symbol">${icon('inbox')}</span><div><strong>${n} 项需要处理</strong><p>${[['setup','项待设置'],['trust','项待信任'],['paused','项自动触发暂停']].map(([state,label])=>[items.filter(x=>x.state===state).length,label]).filter(([count])=>count).map(([count,label])=>`${count} ${label}`).join('，')}</p></div>${btn('查看待处理','data-tab="attention" data-reset')}`;
 const showActivity=tab==='activity'; $('filters').hidden=showActivity; $('results').hidden=showActivity; $('activity').hidden=!showActivity;
 if(showActivity){renderActivity();return;}
 const term=$('query').value.trim().toLocaleLowerCase();const cat=$('category').value;
 const shown=items.filter(x=>(tab!=='attention'||needs(x))&&(cat==='all'||x.group===cat)&&[x.name,x.description,x.group,x.where,...x.actions].join(' ').toLocaleLowerCase().includes(term));
 $('result-count').textContent=`${shown.length} 项`;
 if(!shown.length){const clear=term||cat!=='all';const title=clear?'没有匹配的扩展':tab==='attention'?'目前没有待处理事项':'还没有安装扩展';const desc=clear?'试试名称、功能、入口，或清除筛选。':tab==='attention'?'需要配置、确认信任或恢复时，会出现在这里。':'导入本地 ZIP 后，可以检查用途并决定是否启用。';$('results').innerHTML=`<div class="empty"><div><h2>${title}</h2><p>${desc}</p>${clear?btn('清除筛选','data-clear'):tab==='attention'?btn('返回已安装','data-tab="installed"'):btn('导入扩展','data-import','primary')}</div></div>`;return;}
 $('results').innerHTML=`<div class="tiles">${shown.map(x=>`<button type="button" class="tile" data-open="${x.id}"><div class="tile-head"><span class="app-icon ${x.style}">${icon(x.icon)}</span><strong>${e(x.name)}</strong></div><p>${e(x.description)}</p><div class="tile-foot"><span class="route">${e(x.group)} · ${e(x.where)}</span>${status(x)}${icon('chevron')}</div></button>`).join('')}</div>`;
}
function renderActivity(){
 const shown=events.filter(x=>!failedOnly||x.state==='失败');
 $('activity').innerHTML=`<div class="activity-bar"><div><h2>本次会话</h2><p class="muted">手动与自动调用按时间排列，不显示原始输入。</p></div><label><input id="failed-only" type="checkbox" ${failedOnly?'checked':''}> 只看失败</label></div><div class="activity-list">${shown.map(x=>{const item=items.find(i=>i.id===x.id);return `<article class="event"><time>${x.time}</time><div><strong><span class="tag ${x.tone}">${x.state}</span>${e(item?.name??'已移除扩展')} · ${x.mode}</strong><p>${x.message}</p></div>${item?btn(x.action,`data-event="${events.indexOf(x)}"`):'<span class="muted">已移除</span>'}</article>`;}).join('')||'<div class="empty"><h2>没有匹配的调用记录</h2></div>'}</div>`;
}
let returnTo = '';
function openItem(id,page='overview',event=null){selected=items.find(x=>x.id===id);if(!selected)return;returnTo=event?`[data-event="${events.indexOf(event)}"]`:`[data-open="${id}"]`;panelPage=page;activeEvent=event;renderSheet();if(!$('sheet').open)$('sheet').showModal();$('sheet-title').focus();}
function renderSheet(){
 const x=selected;if(!x)return;
 const panes=[['overview','怎么用'],...(x.field?[['settings','设置']]:[]),...(x.event?[['auto','自动触发']]:[]),['source','来源']];
 if(panelPage==='log')panes.push(['log','调用详情']);
 let html='', footer=btn('关闭','data-close-sheet');
 if(panelPage==='overview'){
 const pending=x.state==='setup'?['填写扩展设置','保存镜像前缀后即可使用，原链接不会被修改。','去设置','data-page="settings"']:x.state==='trust'?['尚未信任此扩展','先检查来源和运行环境，再决定是否授权。','检查信任','data-review-trust']:x.state==='off'?['扩展尚未启用','启用不会执行动作，也不会打开自动触发。','启用扩展','data-enable']:x.state==='paused'?['自动触发已暂停','检查失败原因后恢复；不会重放旧事件。','查看自动触发','data-page="auto"']:null;
 if(pending){html+=`<section class="notice warn"><strong>${pending[0]}</strong>${pending[1]}</section>`;footer+=btn(pending[2],pending[3],'primary');}
 html+=`<section><h3 class="subhead">在哪使用</h3><div class="use-route"><div class="steps">${x.steps.map((step,i)=>`${i?icon('chevron'):''}<span class="step">${e(step)}</span>`).join('')}</div></div></section><section><h3 class="subhead">可以做什么</h3><div class="use-route">${x.actions.map(a=>`<div>${e(a)}</div>`).join('')}</div></section>`;
 if(!pending)html+=`<p class="muted">打开详情不会执行扩展。</p>`;
 if(x.id==='proxy'&&x.state==='ready'&&!x.optIn)html+='<div class="notice">未授权第三方镜像，将继续使用原始链接。</div>';
 }else if(panelPage==='settings'){
 const draft=drafts.get(x.id)??{value:x.setting,optIn:x.optIn};
 html=`<section class="field"><label for="setting-field">${e(x.field)}（必填）</label><input id="setting-field" type="text" autocomplete="off" placeholder="https://…" value="${e(draft.value)}" aria-describedby="setting-help setting-error"><small id="setting-help">只处理明确公开的 GitHub 资源，不转发登录凭据。</small><div class="notice bad" role="alert" id="setting-error" hidden></div></section><label class="inline"><input id="mirror-opt-in" type="checkbox" ${draft.optIn?'checked':''}> 同意将公开链接交给第三方镜像</label><p class="muted">镜像能看到链接和内容。关闭时继续使用原始链接。</p>`;
 if(activeEvent)html=`<div class="notice warn"><strong>最近失败</strong>${e(activeEvent.message)}</div>`+html;
 footer=btn('取消修改','data-cancel-settings')+btn('保存设置','data-save','primary');
 }else if(panelPage==='auto'){
 html=`<div class="use-route inline split"><div><strong>下载任务完成时</strong><p>此项和「启用扩展」分开保存。</p></div><label><input type="checkbox" id="automatic" ${x.subscribed?'checked':''} ${x.state!=='ready'?'disabled':''}> 自动触发</label></div>${x.state==='paused'?'<div class="notice bad">连续三次失败，已暂停。恢复只等待下一次事件。</div>':''}`;
 if(x.state==='paused')footer+=btn('恢复自动触发','data-resume','primary');
 }else if(panelPage==='log'&&activeEvent){html=`<div class="notice ${activeEvent.tone}"><strong>${activeEvent.state} · ${activeEvent.time}</strong>${e(activeEvent.message)}</div><p class="muted">${e(activeEvent.mode)}</p>`;}
 else{html=`<dl class="meta"><dt>来源</dt><dd>${e(x.source)}</dd><dt>版本</dt><dd>${e(x.version)}</dd><dt>运行环境</dt><dd>${e(x.runtime||'声明式，无需解释器')}</dd></dl>${x.runtime?'<div class="notice warn">脚本以当前用户权限运行。作者的权限声明不是系统访问限制。</div>':''}<section class="section-rule inline split"><span class="muted">扩展管理</span><div class="inline">${x.state==='ready'||x.state==='setup'||x.state==='paused'?btn('停用扩展','data-disable'):''}${btn('移除','data-remove','danger')}</div></section>`;}
 $('sheet').innerHTML=`<header class="panel-header"><div><h2 id="sheet-title" tabindex="-1">${e(x.name)}</h2><p>${status(x)}　${e(x.group)} · ${e(x.where)}</p></div><button type="button" class="btn icon" aria-label="关闭详情" data-close-sheet>${icon('close')}</button></header><nav class="tabs panel-tabs" aria-label="扩展详情">${panes.map(([key,label])=>`<button type="button" data-page="${key}" ${key===panelPage?'aria-current="page"':''}>${label}</button>`).join('')}</nav><div class="panel-body">${html}</div><footer class="panel-footer">${footer}</footer>`;
}
function renderModal(){
 let title='',text='',actions=''; const cancel=btn('取消','data-close-dialog');
 if(modal==='choose'){
 title='导入扩展'; text=`<div class="notice">请选择一个本地 ZIP 扩展包。原型用下列示例演示检查结果。</div><div class="seg" aria-label="导入示例">${[['new','新扩展'],['same','相同内容'],['replace','不同版本'],['broken','无效 ZIP']].map(([key,label])=>btn(label,`data-case="${key}" aria-pressed="${packageCase===key}"`)).join('')}</div><div class="use-route"><strong>${e(packageCase==='new'?'文本行排序.zip':packageCase==='broken'?'缺少清单.zip':packageCase==='same'?'下载链接清单-1.0.0.zip':'下载链接清单-1.1.0.zip')}</strong><p>检查不会运行程序或修改已安装的扩展。</p></div>`;actions=cancel+btn('检查扩展包','data-preview','primary');
 }else if(modal==='review'){
 const candidate=importCandidate();const match=items.find(x=>x.id===candidate.id);const existing=Boolean(match);const identical=existing&&match.version===candidate.version;const invalid=packageCase==='broken';
 title=invalid?'无法导入扩展':identical?'扩展已安装':!existing?'确认导入':'确认替换';
 if(invalid){text='<div class="notice bad" role="alert"><strong>ZIP 缺少 extension.json</strong>请向作者取得有效的扩展包，再重新选择。</div>';actions=cancel+btn('重新选择','data-rechoose','primary');}
 else if(identical){text=`<div class="notice ok"><strong>${e(match.name)} ${e(match.version)}</strong>扩展内容相同，无需替换。现有配置不变。</div>`;actions=btn('关闭','data-close-dialog','primary');}
 else {text=`<div><h3 class="subhead">${e(candidate.name)}</h3><p class="version">${existing?`${e(match.version)} → `:''}${e(candidate.version)}</p></div>${existing?'<div class="notice warn"><strong>替换后的变化</strong>扩展将停用并要求重新信任。普通设置恢复为新包默认值；如果有自动订阅，需要重新开启。扩展持久数据保留。</div>':'<div class="notice">导入后保持停用；导入不等于信任或启用。</div>'}<dl class="meta"><dt>来源</dt><dd>本地 ZIP</dd><dt>使用位置</dt><dd>${e(candidate.group)} · ${e(candidate.where)}</dd><dt>运行环境</dt><dd>Python</dd></dl><div class="notice warn">脚本信任后可使用当前用户权限；作者声明不是系统访问限制。</div>`;actions=cancel+btn(!existing?'导入扩展':'替换扩展','data-commit-import','primary');}
 }else if(modal==='trust'){
 title='检查来源与信任';text=`<dl class="meta"><dt>扩展</dt><dd>${e(selected.name)}</dd><dt>来源</dt><dd>${e(selected.source)}</dd><dt>运行环境</dt><dd>${e(selected.runtime)}（示例：已找到）</dd></dl><div class="notice warn">脚本可使用当前用户权限。请仅在确认来源和代码可信时继续。</div>`;actions=cancel+btn('确认信任','data-trust','primary');
 }else if(modal==='remove'){
 title='移除扩展';text=`<div class="notice warn">移除「${e(selected.name)}」后，它不再出现在使用入口中。扩展数据默认保留。</div><label><input id="clear-data" type="checkbox"> 同时清除扩展数据</label>`;actions=cancel+btn('移除扩展','data-confirm-remove','primary');
 }else{
 const copy={runtime:['运行环境','Python 3.12（示例）','集中查看解释器路径和探测结果；单个扩展仍可选择专用路径。'],chains:['下载解析链','当前没有手动配置的解析链','在此按域名指定解析器及其顺序；修改需明确保存。'],data:['保留数据','没有已保留的数据','移除扩展后选择保留的数据会显示在这里。']};const row=copy[modal];title=row[0];text=`<div class="use-route"><strong>${row[1]}</strong><p>${row[2]}</p></div>`;actions=btn('关闭','data-close-dialog');
 }
 $('dialog').innerHTML=`<header class="panel-header"><h2 id="dialog-title" tabindex="-1">${title}</h2><button type="button" class="btn icon" aria-label="关闭窗口" data-close-dialog>${icon('close')}</button></header><div class="dialog-body">${text}</div><footer class="dialog-footer">${actions}</footer>`;
}
function openModal(which){modal=which;renderModal(); if(!$('dialog').open)$('dialog').showModal();$('dialog-title').focus();}
function setTools(open){$('tools').setAttribute('aria-expanded',String(open));$('tools-menu').hidden=!open;if(open)$('tools-menu').querySelector('button').focus();}
function takeAction(ev){const t=ev.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.tab){setTab(d.tab,'reset' in d);$('tabs').querySelector('[aria-current]').focus();}
 else if(d.open)openItem(d.open);
 else if(d.event){const event=events[Number(d.event)];openItem(event.id,event.page,event);}
 else if(d.page){panelPage=d.page;renderSheet();$('sheet').querySelector('[aria-current]')?.focus();}
 else if('closeSheet' in d)$('sheet').close();
 else if('import' in d){packageCase='new';openModal('choose');}
 else if('clear' in d){$('query').value='';$('category').value='all';render();$('query').focus();}
 else if(d.menu){setTools(false);$('tools').focus();openModal(d.menu);}
 else if('closeDialog' in d)$('dialog').close();
 else if(d.case){packageCase=d.case;renderModal();$('dialog').querySelector('[aria-pressed=true]').focus();}
 else if('preview' in d)openModal('review');
 else if('rechoose' in d)openModal('choose');
 else if('commitImport' in d){const candidate=importCandidate();const index=items.findIndex(x=>x.id===candidate.id);if(index<0)items.push(candidate);else if(items[index].version!==candidate.version)items[index]=candidate;$('dialog').close();setTab('installed',true);notify('扩展已登记，尚未启用。');}
 else if('reviewTrust' in d)openModal('trust');
 else if('trust' in d){selected.state='off';$('dialog').close();render();renderSheet();$('sheet-title').focus();}
 else if('enable' in d){selected.state=selected.field&&!selected.setting?'setup':'ready';render();renderSheet();$('sheet-title').focus();notify('已启用；没有执行扩展。');}
 else if('disable' in d){selected.state='off';render();renderSheet();$('sheet-title').focus();notify('扩展已停用。');}
 else if('resume' in d){selected.state='ready';render();renderSheet();$('sheet-title').focus();notify('已恢复自动触发，不会重放旧事件。');}
 else if('cancelSettings' in d){drafts.delete(selected.id);panelPage='overview';renderSheet();$('sheet-title').focus();}
 else if('save' in d){const field=$('setting-field');let valid=false;try {const url=new URL(field.value.trim());valid=url.protocol==='https:'&&Boolean(url.hostname)&&field.value.trim().endsWith('/');} catch{} if(!valid){$('setting-error').textContent='请输入以 / 结尾的完整 HTTPS 地址。';$('setting-error').hidden=false;field.setAttribute('aria-invalid','true');field.focus();return;} selected.setting=field.value.trim();selected.optIn=$('mirror-opt-in').checked;drafts.delete(selected.id);if(selected.state==='setup')selected.state='ready';render();panelPage='overview';activeEvent=null;renderSheet();$('sheet-title').focus();notify(selected.optIn?'设置已保存。':'设置已保存；未授权镜像，仍使用原始链接。');}
 else if('remove' in d)openModal('remove');
 else if('confirmRemove' in d){items.splice(items.indexOf(selected),1);drafts.delete(selected.id);const clear=$('clear-data').checked;$('dialog').close();$('sheet').close();render();$('query').focus();notify(clear?'扩展已移除，示例数据已清除。':'扩展已移除，数据保留。');}
}
$('import').innerHTML=icon('plus')+'导入扩展';$('import').dataset.import='';
$('tools').innerHTML=icon('more')+'<span class="tools-label">管理</span>';$('tools').setAttribute('aria-label','扩展管理');
$('tools-menu').innerHTML=[['runtime','运行环境','tool'],['chains','下载解析链','link'],['data','保留数据','box']].map(([key,label,i])=>`<button type="button" data-menu="${key}">${icon(i)}${label}</button>`).join('');
$('rail-nav').innerHTML=[['download','下载'],['search','速启'],['clip','剪贴板'],['puzzle','扩展'],['box','归档'],['tool','其他工具']].map(([key,label])=>`<div class="nav-item ${key==='puzzle'?'current':''}" ${key==='puzzle'?'aria-current="page"':''}>${icon(key)}<span>${label}</span></div>`).join('');
$('search-wrap').insertAdjacentHTML('afterbegin',icon('search'));
$('theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';updateTheme();});
$('tools').addEventListener('click',()=>setTools($('tools-menu').hidden));
$('query').addEventListener('input',render);$('category').addEventListener('change',render);
document.addEventListener('click',ev=>{if(!ev.target.closest('.menu-wrap')&&!$('tools-menu').hidden)setTools(false);takeAction(ev);});
document.addEventListener('input',ev=>{if(['setting-field','mirror-opt-in'].includes(ev.target.id))drafts.set(selected.id,{value:$('setting-field').value,optIn:$('mirror-opt-in').checked});});
document.addEventListener('change',ev=>{if(ev.target.id==='failed-only'){failedOnly=ev.target.checked;renderActivity();$('failed-only').focus();}if(ev.target.id==='automatic'){selected.subscribed=ev.target.checked;notify(selected.subscribed?'自动触发已开启，等待下次事件。':'自动触发已关闭。');}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('tools-menu').hidden){setTools(false);$('tools').focus();}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='f'&&!$('dialog').open&&!$('sheet').open){ev.preventDefault();if(tab==='activity')setTab('installed');$('query').focus();}});
$('sheet').addEventListener('close',()=>{selected=null;const trigger=$('content').querySelector(returnTo)||$('tabs').querySelector('[aria-current]');trigger?.focus({preventScroll:true});});
updateTheme();render();
</script>
</body>
</html>
