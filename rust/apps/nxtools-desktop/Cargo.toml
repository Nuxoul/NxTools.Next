[package]
name = "nxtools-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
base64 = "0.22.1"
chrono.workspace = true
gpui-kit = { workspace = true, features = [
    "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-csharp",
    "tree-sitter-css", "tree-sitter-go", "tree-sitter-html", "tree-sitter-java",
    "tree-sitter-javascript", "tree-sitter-markdown", "tree-sitter-python",
    "tree-sitter-rust", "tree-sitter-sql", "tree-sitter-tsx", "tree-sitter-typescript",
] }
gpui-kit-markdown-editor.workspace = true
image = { workspace = true, features = ["gif", "jpeg", "bmp", "webp"] }
imagesize.workspace = true
markdown.workspace = true
reqwest.workspace = true
flate2 = { version = "=1.1.9", default-features = false, features = ["zlib-rs"] }
nxtools-archive = { path = "../../crates/nxtools-archive" }
nxtools-clipboard = { path = "../../crates/nxtools-clipboard" }
nxtools-core = { path = "../../crates/nxtools-core" }
nxtools-download = { path = "../../crates/nxtools-download" }
nxtools-download-ipc = { path = "../../crates/nxtools-download-ipc" }
nxtools-extensions = { path = "../../crates/nxtools-extensions" }
nxtools-finder = { path = "../../crates/nxtools-finder" }
nxtools-ipc = { path = "../../crates/nxtools-ipc" }
nxtools-network = { path = "../../crates/nxtools-network" }
nxtools-protocol = { path = "../../crates/nxtools-protocol" }
rusqlite.workspace = true
similar = "2.7.0"
raw-window-handle.workspace = true
windows-sys.workspace = true
serde_json.workspace = true
serde.workspace = true
url.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width.workspace = true
uuid.workspace = true
# Windows 10 frosted material: the host-backdrop visual through Windows.UI.Composition.
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Numerics",
    "Graphics_Effects",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
] }
windows-numerics = "0.3.1"
# COM implementation (`#[implement]`) of the acrylic effect graph; already the `windows` core.
windows-core = "0.62.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3.20.0"
nxtools-extensions = { path = "../../crates/nxtools-extensions", features = ["test-support"] }
zip.workspace = true
nxtools-download = { path = "../../crates/nxtools-download", features = ["test-support"] }

[build-dependencies]
embed-resource = "3.0.11"

[lints]
workspace = true
